<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#faf9f4" />
<title>断联日记 NOEX · Web Demo</title>
<style>
/* === 全局 === */
*,*::before,*::after { box-sizing: border-box; }
html,body { margin:0; padding:0; height:100%; }
body {
  background: #efece4;
  color: #26231e;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* 设计 token (1rpx ≈ 0.5px, 以 iPhone 12 mini 375px 宽为基准) */
:root {
  --bg:        #faf9f4;
  --card:      #ffffff;
  --ink:       #26231e;
  --sub:       #8f887b;
  --faint:     #b8b1a4;
  --line:      #e9e4d8;
  --accent:    #b5623c;
  --accent-soft:#f5ece6;
  --danger:    #a5432e;
}

button { font: inherit; color: inherit; cursor: pointer; }

/* 移动端设备外框——桌面居中 */
#app {
  position: relative;
  width: 100%;
  max-width: 375px;
  min-height: 100vh;
  margin: 0 auto;
  background: var(--bg);
  overflow: hidden;
  box-shadow: 0 0 60px rgba(0,0,0,.06);
}

@media (min-width: 480px) {
  #app { margin-top: 20px; margin-bottom: 20px; min-height: calc(100vh - 40px); border-radius: 28px; }
}

/* === 通用工具类 === */
.serif { font-family: "Songti SC", "STSong", "Source Han Serif SC", serif; }
.card {
  background: var(--card);
  border: 0.5px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  margin: 0 16px 12px;
}
.btn {
  display: block;
  width: calc(100% - 32px);
  margin: 14px 16px;
  padding: 14px;
  border-radius: 14px;
  text-align: center;
  font-size: 15px;
  letter-spacing: 2px;
  background: var(--ink);
  color: var(--bg);
  border: none;
}
.btn-ghost {
  background: transparent;
  border: 0.5px solid var(--line);
  color: var(--sub);
  font-size: 14px;
  letter-spacing: 1px;
  padding: 10px;
  border-radius: 12px;
}
.btn-danger { background: var(--danger); color: #fff; }
.tag {
  display: inline-block;
  font-size: 11px;
  color: var(--sub);
  border: 0.5px solid var(--line);
  border-radius: 99px;
  padding: 2px 10px;
  letter-spacing: 1px;
}
.divider { height: 0.5px; background: var(--line); margin: 18px 0; }
.field-label { display:block; font-size:12px; color:var(--sub); margin-bottom:6px; letter-spacing:1px; }
.field-input,
.field-textarea {
  width: 100%; background: var(--card); border: 0.5px solid var(--line);
  border-radius: 12px; padding: 12px 14px; font-size: 15px;
  font-family: inherit; resize: none; min-height: 44px;
}

/* === 页面进入动画 === */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}
.page { animation: fadeIn 0.28s ease; }

/* ============================================================
   Tab 容器 / 路由
   ============================================================ */
.tab-pages { padding-bottom: 64px; min-height: 100vh; }
.page-pane { display: none; }
.page-pane.active { display: block; }

/* ============================================================
   TabBar 底部导航 (固定)
   ============================================================ */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  max-width: 375px;
  margin: 0 auto;
  height: 56px;
  background: var(--bg);
  border-top: 0.5px solid var(--line);
  display: flex;
  z-index: 50;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--faint);
  font-size: 11px;
  letter-spacing: 1px;
  border: none;
  background: transparent;
  padding: 6px 0;
  transition: color .2s;
}
.tab.on { color: var(--ink); }
.tab .ti { width: 22px; height: 22px; margin-bottom: 2px; }
.tab svg { fill: currentColor; }

/* ============================================================
   Onboard
   ============================================================ */
.ob { padding: 60px 24px 32px; text-align: center; min-height: 100vh; }
.ob-logo { width: 80px; height: 80px; margin: 30px auto 26px; background: linear-gradient(160deg,#a5896f 0%,#3b322a 100%); border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.12); position: relative; overflow: hidden; display:flex; align-items:center; justify-content:center; }
.ob-logo::before { content:""; position:absolute; width:18px; height:12px; background: var(--bg); border-radius: 50%; top: 26px; left: 18px; box-shadow: 28px 0 0 var(--bg), 0 0 0 2px rgba(0,0,0,.4); }
.ob-logo::after  { content:""; position:absolute; width:8px; height:8px; background:#26231e; border-radius: 50%; top: 28px; left: 24px; box-shadow: 28px 0 0 #26231e; }
.ob-title { font-size: 26px; letter-spacing: 6px; font-weight: 500; }
.ob-en    { font-size: 13px; letter-spacing: 8px; color: var(--faint); margin-top: 4px; }
.ob-p     { font-size: 14px; color: var(--sub); margin: 28px 8px 40px; line-height: 1.9; letter-spacing: 1px; }
.ob-title-sm { font-size: 22px; letter-spacing: 4px; margin-bottom: 10px; }
.ob-avatar { width: 110px; height: 110px; margin: 30px auto 18px; background: #2b2520; border-radius: 50%; position: relative; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.ob-avatar::before { content:""; position:absolute; top:18px; left:24px; width:16px; height:14px; background:#fff; border-radius:50%; box-shadow: 38px 0 0 #fff; }
.ob-avatar::after { content:""; position:absolute; top:24px; left:28px; width:8px; height:8px; background:#26231e; border-radius:50%; box-shadow: 38px 0 0 #26231e; }
.ob-btn { width: calc(100% - 48px); margin: 32px 24px 0; }
.ob .field { text-align: left; }

/* ============================================================
   Today
   ============================================================ */
.today { padding: 18px 0 32px; }
.head { display:flex; justify-content: space-between; align-items: center; padding: 4px 24px 14px; }
.brand { font-size: 16px; letter-spacing: 4px; }
.day-hero { text-align: center; padding: 16px 0 24px; }
.num-text { font-size: 92px; font-weight: 200; line-height: 1; letter-spacing: -4px; font-family: "Songti SC", "Source Han Serif SC", serif; }
.num-suffix { font-size: 22px; letter-spacing: 4px; color: var(--sub); margin-left: 4px; }
.cap { font-size: 14px; letter-spacing: 4px; color: var(--ink); margin-top: 8px; }
.sub  { font-size: 12px; color: var(--faint); margin-top: 6px; letter-spacing: 1px; }
.fox-bar { display: flex; align-items: center; gap: 14px; }
.fox-ava { width: 44px; height: 44px; border-radius: 50%; background:#fff; border:1px solid var(--line); flex: none; overflow:hidden; position:relative; }
.fox-ava::before { content:""; position:absolute; top:18px; left:12px; width:5px; height:5px; background:#8f887b; border-radius:50%; box-shadow: 15px 0 0 #8f887b; }
.fox-info { flex: 1; min-width: 0; }
.fox-who { font-size: 13px; letter-spacing: 1px; color: var(--ink); }
.fox-say { font-size: 13px; color: var(--sub); line-height: 1.6; margin-top: 2px; }

.check-card { padding: 16px; }
.check-btn {
  width: 100%; padding: 16px; background: var(--ink); color: var(--bg);
  border: none; border-radius: 14px; font-size: 14px; letter-spacing: 4px;
  cursor: pointer; transition: opacity .2s;
}
.check-btn.checked, .check-btn:disabled { background: var(--line); color: var(--sub); cursor: default; }
.relapse-btn {
  display: block; width: 100%; margin-top: 14px; background: transparent;
  border: none; color: var(--faint); font-size: 13px; padding: 4px 0;
  text-decoration: underline; text-underline-offset: 4px; letter-spacing: 1px;
}
.check-card { text-align: center; }

.ms-track {
  display: flex; justify-content: space-between; margin: 18px 0 8px; gap: 2px;
}
.ms { flex: 1; text-align: center; }
.ms .dot { width: 6px; height: 6px; background: var(--line); border-radius: 50%; margin: 0 auto 4px; }
.ms .d { font-size: 10px; color: var(--faint); line-height: 1.2; }
.ms.done .dot { background: var(--accent); }
.ms.done .d { color: var(--accent); }
.ms-progress { height: 3px; background: var(--line); border-radius: 99px; margin: 8px 0 6px; overflow: hidden; }
.ms-progress-i { height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.ms-next { font-size: 12px; color: var(--sub); letter-spacing: 1px; margin-top: 6px; }

.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; }
.act {
  background: var(--card); border: 0.5px solid var(--line); border-radius: 16px;
  padding: 16px; text-align: center;
}
.act-t { font-size: 14px; letter-spacing: 2px; }
.act-d { font-size: 12px; color: var(--sub); margin-top: 4px; letter-spacing: 1px; }

/* ============================================================
   Xiaobai 聊天
   ============================================================ */
.xa { display: flex; flex-direction: column; height: 100vh; padding-bottom: 0; }
.persona {
  display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto;
  scrollbar-width: none;
}
.persona::-webkit-scrollbar { display: none; }
.pchip {
  flex: none; padding: 8px 14px; border: 0.5px solid var(--line); border-radius: 14px;
  background: var(--card); min-width: 96px; cursor: pointer;
}
.pchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pchip-b { font-size: 13px; letter-spacing: 2px; }
.pchip-d { font-size: 10px; opacity: .8; margin-top: 2px; }
.chat-head {
  display: flex; align-items: center; gap: 12px; padding: 12px 18px;
  border-bottom: 0.5px solid var(--line);
}
.chat-head .n { font-size: 14px; letter-spacing: 2px; }
.chat-head .s { font-size: 11px; color: var(--sub); margin-top: 2px; letter-spacing: 1px; }
.ava { width: 36px; height: 36px; border-radius: 50%; background:#2b2520; position:relative; overflow:hidden; flex: none; }
.ava::before { content:""; position:absolute; top:6px; left:8px; width:5px; height:5px; background:#fff; border-radius:50%; box-shadow: 16px 0 0 #fff; }
.ava::after  { content:""; position:absolute; top:9px; left:10px; width:4px; height:4px; background:#26231e; border-radius:50%; box-shadow: 16px 0 0 #26231e; }

.msgs {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--bg);
  -webkit-overflow-scrolling: touch;
}
.row { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
.row.ai { align-self: flex-start; }
.row.me { align-self: flex-end; flex-direction: row-reverse; }
.row.sys { align-self: center; }
.bubble {
  background: var(--card); padding: 10px 14px;
  border-radius: 14px 14px 14px 4px; max-width: 70%;
  font-size: 14px; line-height: 1.7; letter-spacing: .5px; white-space: pre-wrap; word-break: break-word;
  border: 0.5px solid var(--line);
}
.me-bubble {
  background: var(--accent-soft); color: var(--ink);
  border: 0.5px solid #ead5c5; border-radius: 14px 14px 4px 14px;
}
.me-ava { background:#3a4a3a; color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; }
.me-ava::before, .me-ava::after { display:none; }
.tip { font-size: 11px; color: var(--faint); margin-top: 4px; letter-spacing: 1px; }
.sys-text {
  background: var(--line); padding: 6px 12px; border-radius: 8px;
  font-size: 12px; color: var(--sub); letter-spacing: 1px; max-width: 80%; text-align: center;
}

.bubble.typing { display: flex; gap: 3px; padding: 14px 12px; }
.bubble.typing span {
  width: 6px; height: 6px; background: var(--sub); border-radius: 50%;
  animation: bounce 1.2s infinite ease-in-out;
}
.bubble.typing span:nth-child(2) { animation-delay: .2s; }
.bubble.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,80%,100% { opacity:.3; transform: translateY(0);} 40%{opacity:1; transform: translateY(-3px);} }

/* 输入区 */
.composer {
  border-top: 0.5px solid var(--line);
  background: var(--bg);
  padding: 8px 12px 12px;
}
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display:none; }
.chip {
  flex: none; padding: 6px 12px; background: var(--card); border: 0.5px solid var(--line);
  border-radius: 99px; font-size: 12px; color: var(--sub); cursor: pointer;
}
.input-row { display: flex; align-items: center; gap: 8px; }
.ta {
  flex: 1;
  background: var(--card);
  border: 0.5px solid var(--line);
  border-radius: 18px;
  padding: 8px 14px;
  font-size: 14px;
  line-height: 1.5;
  resize: none;
  min-height: 36px;
  max-height: 100px;
  font-family: inherit;
  outline: none;
  box-sizing: border-box;
}
.ta:focus { border-color: var(--accent); }
.send-btn {
  /* 模拟小程序 send-round-v2：严格圆形 32x32 */
  width: 32px !important;
  height: 32px !important;
  min-height: 32px !important;
  padding: 0 !important;
  margin: 0 !important;
  border-radius: 50% !important;
  border: none !important;
  background: var(--ink) !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  font-size: 0 !important;
  flex: none;
}
.send-btn::after { content: ""; display: none; }
.send-arrow {
  width: 0; height: 0;
  border-left: 7px solid var(--bg);
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  margin-left: 2px;
}

/* 危机弹层 */
.crisis-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  max-width: 375px; margin: 0 auto;
}
.crisis-modal {
  background: var(--bg); border-radius: 18px; padding: 24px; width: calc(100% - 48px);
  max-width: 280px; animation: fadeIn .3s;
}
.crisis-title { font-size: 16px; letter-spacing: 2px; color: var(--danger); margin-bottom: 12px; }
.crisis-body  { font-size: 13px; line-height: 1.9; color: var(--sub); margin-bottom: 18px; white-space: pre-wrap; }
.crisis-modal .btn { margin: 0; }

/* 留白瓶浮层 (在 today 内点开后浮) */
.modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.4);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 200; max-width: 375px; margin: 0 auto;
}
.modal-card {
  width: 100%; max-height: 80vh; background: var(--bg);
  border-radius: 20px 20px 0 0; padding: 18px 16px;
  display: flex; flex-direction: column; animation: slideUp .3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-head { display:flex; justify-content: space-between; align-items:center; padding-bottom:10px; }
.modal-h { font-size: 16px; letter-spacing: 4px; }
.modal-close { background: transparent; border: none; color: var(--sub); font-size: 20px; padding: 0 4px; }
.modal-body { flex: 1; overflow-y: auto; padding: 8px 0 12px; }

/* ============================================================
   Yingzi 影子
   ============================================================ */
.yz { padding: 18px 0 32px; }
.view-intro { text-align: center; padding: 24px 22px; }
.art { width: 80px; height: 80px; margin: 0 auto 14px; background:#2b2520; border-radius: 50%; position:relative; overflow:hidden; }
.art .ava-grey { width: 100%; height: 100%; }
.art::before { content:""; position:absolute; top:18px; left:20px; width:14px; height:12px; background:#fff; border-radius:50%; box-shadow: 28px 0 0 #fff; opacity: .55; }
.view-intro .h { font-size: 22px; letter-spacing: 6px; }
.view-intro .en { font-size: 12px; color: var(--faint); letter-spacing: 4px; margin-top: 4px; }
.view-intro .p { font-size: 13px; color: var(--sub); line-height: 1.9; margin: 16px 0 14px; text-align: left; }
.ul { text-align: left; margin: 12px 0; }
.ul .li { font-size: 13px; color: var(--sub); padding: 6px 0; padding-left: 18px; position: relative; }
.ul .li::before { content: "·"; position: absolute; left: 4px; color: var(--faint); }
.warn {
  background: #fdf3f0; border: 0.5px solid #e8cfc5;
  border-radius: 12px; padding: 12px 14px; font-size: 12px; color: var(--danger); line-height: 1.8; margin: 14px 0;
  text-align: left;
}
.start-hint { font-size: 12px; color: var(--faint); margin: 14px 0 4px; letter-spacing: 2px; }

.head-row { display: flex; gap: 12px; align-items: center; }
.ava-56 { width: 56px; height: 56px; }
.shadow-name { font-size: 15px; letter-spacing: 2px; }
.shadow-sub  { font-size: 11px; color: var(--sub); margin-top: 4px; }
.profile { font-size: 12px; color: var(--sub); white-space: pre-wrap; line-height: 2; background: var(--accent-soft); padding: 10px 12px; border-radius: 10px; }
.limit-tip { font-size: 12px; color: var(--faint); text-align: center; margin-top: 8px; }
.speakers { font-size: 12px; color: var(--sub); margin-top: 8px; }
.speaker-row { display:flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.sp { padding: 4px 10px; border: 0.5px solid var(--line); border-radius: 99px; font-size: 12px; cursor: pointer; }
.sp-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.spin {
  width: 36px; height: 36px; border: 3px solid var(--line); border-top-color: var(--accent);
  border-radius: 50%; animation: rot 1s linear infinite; margin: 30px auto 14px;
}
@keyframes rot { to { transform: rotate(360deg); } }

.modal-session, .modal-crisis, .modal-gear {
  background: var(--bg); border-radius: 18px; padding: 24px 20px;
  margin: auto; max-width: 300px; width: calc(100% - 48px); max-height: 80vh; overflow-y: auto;
}
.modal-session .h, .modal-crisis .h, .modal-gear .h { font-size: 16px; letter-spacing: 2px; margin-bottom: 12px; text-align: center; }
.modal-session .p, .modal-crisis .p, .modal-gear .p { font-size: 13px; color: var(--sub); line-height: 1.9; text-align: center; }
.breath { text-align: center; margin: 18px 0; font-size: 12px; color: var(--faint); letter-spacing: 4px; }

/* ============================================================
   Me 我
   ============================================================ */
.me { padding: 16px 0 40px; }
.me-gear {
  position: absolute; top: 14px; right: 14px; background: transparent;
  border: none; padding: 6px; color: var(--sub); font-size: 18px; cursor: pointer;
}
.me-head { display:flex; align-items:center; gap: 14px; padding: 24px 20px; }
.me-ava { width: 60px; height: 60px; border-radius: 50%; background: var(--ink); color: var(--bg);
  display:flex; align-items:center; justify-content:center; font-size: 22px; letter-spacing: -1px; }
.me-id .name { font-size: 16px; letter-spacing: 4px; }
.me-id .sub  { font-size: 12px; color: var(--sub); margin-top: 4px; }

.me-section { padding: 6px 0; }
.sec-cap { font-size: 12px; color: var(--faint); letter-spacing: 4px; padding: 14px 22px 6px; }

.persona-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 6px; }
.pg { padding: 12px; border: 0.5px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; }
.pg-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pg-b { font-size: 14px; letter-spacing: 2px; }
.pg-s { font-size: 11px; opacity: .8; margin-top: 2px; }

.me-card { background: var(--card); border: 0.5px solid var(--line); border-radius: 16px; margin: 0 16px; padding: 4px 16px; }
.me-card .row { display:flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 0.5px solid var(--line); }
.me-card .row:last-child { border-bottom: none; }
.me-card .l { font-size: 14px; color: var(--ink); }
.me-card .l small { display:block; font-size: 11px; color: var(--faint); margin-top: 2px; }
.me-input { background: transparent; border: none; text-align: right; font-size: 14px; outline: none; }
.picker-v { font-size: 14px; color: var(--ink); }

.me-foot { text-align: center; font-size: 11px; color: var(--faint); margin-top: 32px; letter-spacing: 2px; }

.about { font-size: 13px; color: var(--sub); line-height: 1.9; }
.crisis { background: #fdf3f0; padding: 14px; border-radius: 12px; margin-top: 14px; font-size: 12px; color: var(--danger); line-height: 1.8; }
.crisis b { display:block; margin-bottom: 6px; letter-spacing: 1px; }
.btn-ghost-danger { color: var(--danger); border-color: #e8cfc5; }

/* ============================================================
   Toast
   ============================================================ */
.toast {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: rgba(0,0,0,.78); color: #fff; font-size: 13px; letter-spacing: 1px;
  padding: 10px 18px; border-radius: 10px; z-index: 999; pointer-events: none;
  animation: toastIn .2s;
  max-width: 80%;
  text-align: center;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -50%) scale(.94); } to { opacity: 1; transform: translate(-50%,-50%) scale(1);} }

/* ============================================================
   Bottle 留白瓶 (列表里也有)
   ============================================================ */
.bottle-intro { padding: 16px 22px; text-align: center; }
.bottle-h    { font-size: 20px; letter-spacing: 6px; }
.bottle-sub  { font-size: 12px; color: var(--sub); margin-top: 6px; letter-spacing: 1px; }
.bottle-new  { padding: 0 16px 12px; }

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' +
    ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
    ('0' + d.getDate()).slice(-2);
}

function dayNum(startDate) {
  if (!startDate) return 1;
  const a = new Date(startDate + 'T00:00:00');
  const b = new Date(todayStr() + 'T00:00:00');
  return Math.max(1, Math.floor((b - a) / 86400000) + 1);
}

function fmtDate(ds) {
  if (!ds) return '';
  const p = ds.split('-');
  return p[0] + ' 年 ' + parseInt(p[1], 10) + ' 月 ' + parseInt(p[2], 10) + ' 日';
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function hourBucket() {
  const h = new Date().getHours();
  if (h >= 6 && h < 11) return 'morning';
  if (h >= 11 && h < 14) return 'noon';
  if (h >= 14 && h < 18) return 'afternoon';
  if (h >= 18 && h < 23) return 'evening';
  return 'late';
}

function storageLoad() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) {
      const d = defaultState();
      d.startDate = todayStr();
      localStorage.setItem(LS_KEY, JSON.stringify(d));
      return d;
    }
    const s = JSON.parse(raw);
    const d = defaultState();
    for (const k in d) {
      if (s[k] === undefined) {
        if (k === 'shadow') s[k] = JSON.parse(JSON.stringify(d[k]));
        else s[k] = d[k];
      }
    }
    if (!s.startDate) s.startDate = todayStr();
    return s;
  } catch (e) {
    const d = defaultState();
    d.startDate = todayStr();
    return d;
  }
}

function storageSave(S) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }

/* ============================================================
 * Shadow 影子（简化版：直接粘贴日志，分析+聊天）
 * ============================================================ */
function analyzeChat(text) {
  const msgs = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
  const joined = msgs.join('');
  const avgLen = msgs.length ? Math.round(joined.length / msgs.length) : 0;
  const emoji = (joined.match(/[\uD83C-\uDBFF][\uDC00-\uDFFF]/g) || []).length;
  const parts = {};
  ['哈哈','嗯嗯','呀','啦','嘛','哦','~','。。。','？'].forEach(w => {
    const c = joined.split(w).length - 1;
    if (c > 0) parts[w] = c;
  });
  const qRate = msgs.length ? msgs.filter(m => /[?？]$/.test(m)).length / msgs.length : 0;
  const top = Object.keys(parts).sort((a, b) => parts[b] - parts[a]).slice(0, 3);
  return { count: msgs.length, avgLen, emojiLove: emoji > msgs.length * 0.3, top, qRate };
}

  );
  if (p.emojiLove) lines.push('· 习惯用表情收尾');
  if (p.top.length) lines.push('· 常说「' + p.top.join('」「') + '」');
  if (p.qRate > 0.25) lines.push('· 喜欢用反问');
  if (lines.length === 1) lines.push('· 语气比较平，没有明显口头禅');
  return lines.join('\n');
}

function shadowReply(text, profile) {
  const keys = {
    miss:  ['想你','想你了','好想','我还爱你','忘不了'],
    ask:   ['还爱','爱过我','为什么','复合','回来','我们还能','做错了什么','你的意思'],
    angry: ['对不起','抱歉','你凭什么','恨你','骗子','渣'],
    bye:   ['再见','拜拜','走了','最后','告个别','再见了'],
    greet: ['在吗','你好','嗨','是我']
  };
  const pool = {
    miss:  ['嗯。','我知道。','……嗯。','这段时间，你还好吗。'],
    ask:   ['我不知道怎么回答这个。','……这个问题，我想放一放。','你希望我怎么说呢。'],
    angry: ['对不起。','嗯，你说，我听着。','……我没资格解释。'],
    bye:   ['嗯，去吧。','照顾好自己。','……嗯。再见。'],
    greet: ['嗯。','在。','……是你啊。'],
    fallback: ['嗯。','……','在听。','你说。','……']
  };
  for (const k in keys) for (const w of keys[k])
    if (text.indexOf(w) > -1) return pick(pool[k]);
  return pick(pool.fallback);
}

    document.getElementById('yz-enter').onclick = () => { yzMode = 'chat'; renderYingzi(); };

      if (!confirm('要重新设置影子吗？这会清空当前的影子。')) return;
      const S2 = storageLoad();
      S2.shadow = { enabled: false, name: '', profile: null, msgs: [], sessionsDate: '', sessionsToday: 0, sessionStart: 0 };
      storageSave(S2);
      showToast('已关闭');
      renderYingzi();
    };
  } else if (yzMode === 'setup') {
    root.innerHTML = `
      <div class="card">
        <div class="h2" style="font-size:18px;letter-spacing:4px;">设置影子</div>
        <div class="p" style="font-size:13px;color:var(--sub);line-height:1.9;margin:12px 0 18px;">
          把和ta的聊天记录给我：直接粘贴（每行一条消息）。我会分析ta的说话习惯，生成一个「影子」。它只存在于你的手机里。
        </div>
        <div class="field" style="margin:12px 0;">
          <label class="field-label">ta 的代号</label>
          <input class="field-input" id="yz-name" placeholder="怎么称呼ta" value="${escapeHtml(shName)}"/>
        </div>
        <div class="field" style="margin:12px 0;">
          <label class="field-label">聊天记录（每行一条）</label>
          <textarea class="field-textarea" id="yz-log" rows="6" placeholder="例：&#10;2024-08-30 18:30 小明 在吗&#10;2024-08-30 18:31 我 在啊&#10;...">${escapeHtml(shLog)}</textarea>
        </div>
        <button class="btn" id="yz-go">开始分析</button>
        <button class="btn-ghost" style="margin:10px 16px 0; display:block;" id="yz-cancel">先不了</button>
      </div>
    `;
    document.getElementById('yz-name').oninput = e => shName = e.target.value;
    document.getElementById('yz-log').oninput = e => shLog = e.target.value;
    document.getElementById('yz-go').onclick = () => {
      if (!shName.trim() || shLog.trim().length < 10) { showToast('填代号、贴至少 10 条消息'); return; }
      yzMode = 'analyze'; shStep = 0;
      const tick = () => {
        if (shStep >= ANALYZE_STEPS.length) {
          const p = analyzeChat(shLog);
          const S2 = storageLoad();
          S2.shadow.enabled = true;
          S2.shadow.name = shName.trim();
          S2.shadow.profile = p;
          S2.shadow.msgs = [];
          S2.shadow.sessionsDate = todayStr();
          S2.shadow.sessionsToday = 0;
          storageSave(S2);
          yzMode = 'view';
          shName = ''; shLog = ''; shProfile = p;
          renderYingzi();
          return;
        }
        document.getElementById('yz-step').textContent = ANALYZE_STEPS[shStep];
        shStep++;
        setTimeout(tick, 700);
      };
      renderYingzi();
      setTimeout(tick, 100);
    };
    document.getElementById('yz-cancel').onclick = () => { yzMode = 'view'; renderYingzi(); };
  } else if (yzMode === 'analyze') {
    root.innerHTML = `
      <div class="card" style="text-align:center;">
        <div class="spin"></div>
        <div class="step" id="yz-step" style="font-size:13px;color:var(--sub);letter-spacing:2px;">${ANALYZE_STEPS[0]}</div>
      </div>
    `;
  } else if (yzMode === 'chat') {
    const S2 = storageLoad();
    if (!S2.shadow.enabled) { yzMode = 'view'; renderYingzi(); return; }
    // 每次进入 chat mode: 计一次 sessionsToday
    if (!S2.shadow.sessionStart) {
      if (S2.shadow.sessionsDate !== todayStr()) {
        S2.shadow.sessionsDate = todayStr();
        S2.shadow.sessionsToday = 0;
      }
      if (S2.shadow.sessionsToday >= 3) { yzMode = 'view'; renderYingzi(); return; }
      S2.shadow.sessionsToday++;
      S2.shadow.sessionStart = Date.now();
      storageSave(S2);
      if (S2.shadow.msgs.length === 0) {
        S2.shadow.msgs.push({ role: 'sys', text: '（影子不会说「我也想你」「我们复合吧」。它的回应很克制——像 ta 的语气，但不再是 ta。）', t: Date.now() });
        storageSave(S2);
      }
    }
    const remainMs = Math.max(0, 20 * 60 * 1000 - (Date.now() - S2.shadow.sessionStart));
    const min = Math.floor(remainMs / 60000);
    const sec = Math.floor((remainMs % 60000) / 1000);
    const leftToday = 3 - S2.shadow.sessionsToday;
    const sessionMsgs = S2.shadow.msgs.slice();
    root.innerHTML = `
      <div class="chat-head">
        <div class="ava-grey" style="background:#2b2520;border-radius:50%;width:36px;height:36px;position:relative;overflow:hidden;"></div>
        <div>
          <div class="n">${escapeHtml(S2.shadow.name || '影子')}</div>
          <div class="s">AI 影子 · 非真人</div>
        </div>
        <div class="right" style="margin-left:auto;font-size:11px;color:var(--sub);text-align:right;">
          本次剩余 <b style="color:var(--ink);font-size:13px;">${min}:${('0'+sec).slice(-2)}</b>
          <div>今日还剩 ${leftToday} 次</div>
        </div>
      </div>
      <div class="msgs" id="yz-msgs">
        ${sessionMsgs.map(m => {
          if (m.role === 'sys') return `<div class="row sys"><div class="sys-text">${escapeHtml(m.text)}</div></div>`;
          if (m.role === 'ai') return `<div class="row ai"><div class="ava-grey" style="background:#2b2520;border-radius:50%;width:36px;height:36px;position:relative;overflow:hidden;flex:none;"></div><div class="col"><div class="bubble">${escapeHtml(m.text)}</div></div></div>`;
          return `<div class="row me"><div class="bubble me-bubble">${escapeHtml(m.text)}</div><div class="ava me-ava">我</div></div>`;
        }).join('')}
      </div>
      <form class="composer" id="yz-form" style="border-top:0.5px solid var(--line);">
        <div class="input-row">
          <textarea class="ta" id="yz-ta" placeholder="想说的、没说完的，都可以…" rows="1"></textarea>
          <button class="send-btn" type="submit"><div class="send-arrow"></div></button>
        </div>
      </form>
    `;
    const ta = document.getElementById('yz-ta');
    ta.addEventListener('input', () => { ta.style.height = '36px'; ta.style.height = Math.min(ta.scrollHeight, 100) + 'px'; yzText = ta.value; });
    document.getElementById('yz-form').onsubmit = e => {
      e.preventDefault();
      sendYingzi(yzText);
    };
    setTimeout(() => { document.getElementById('yz-msgs').scrollTop = 99999; }, 30);
  }
}
let yzText = '';

function sendYingzi(raw) {
  const text = (raw || '').trim();
  if (!text) return;
  const S = storageLoad();
  S.shadow.msgs.push({ role: 'me', text, t: Date.now() });
  storageSave(S);
  yzText = '';
  document.getElementById('yz-ta').value = '';
  // 立刻渲染
  const row = document.createElement('div');
  row.className = 'row me';
  row.innerHTML = `<div class="bubble me-bubble">${escapeHtml(text)}</div><div class="ava me-ava">我</div>`;
  document.getElementById('yz-msgs').appendChild(row);
  // 打字占位
  const tip = document.createElement('div');
  tip.className = 'row ai';
  tip.innerHTML = `<div class="ava-grey" style="background:#2b2520;border-radius:50%;width:36px;height:36px;position:relative;overflow:hidden;flex:none;"></div><div class="bubble typing"><span></span><span></span><span></span></div>`;
  document.getElementById('yz-msgs').appendChild(tip);
  document.getElementById('yz-msgs').scrollTop = 99999;
  setTimeout(() => {
    tip.remove();
    const reply = shadowReply(text, S.shadow.profile);
    S.shadow.msgs.push({ role: 'ai', text: reply, t: Date.now() });
    storageSave(S);
    const aiRow = document.createElement('div');
    aiRow.className = 'row ai';
    aiRow.innerHTML = `<div class="ava-grey" style="background:#2b2520;border-radius:50%;width:36px;height:36px;position:relative;overflow:hidden;flex:none;"></div><div class="col"><div class="bubble">${escapeHtml(reply)}</div></div>`;
    document.getElementById('yz-msgs').appendChild(aiRow);
    document.getElementById('yz-msgs').scrollTop = 99999;
    // 20 分钟自动结束
    const remainMs = 20 * 60 * 1000 - (Date.now() - S.shadow.sessionStart);
    if (remainMs <= 0) {
      endYingziSession();
    }
  }, 700 + Math.random() * 600);
}

function endYingziSession() {
  const html = `
    <div class="crisis-modal" data-close="0">
      <div class="crisis-title">今天的影子时间结束了</div>
      <div class="crisis-body" style="text-align:center;">深呼吸。刚才和你说话的，是根据聊天记录生成的 AI 影子——<b style="color:var(--ink);">不是真的 ta</b>。</div>
      <div style="text-align:center;margin:16px 0;font-size:12px;color:var(--faint);letter-spacing:4px;">吸气 · 呼气</div>
      <button class="btn" id="end-to-gb" style="background:var(--accent);">把刚才的感受，说给小白听</button>
      <button class="btn btn-ghost" style="margin:10px 0 0; color:var(--sub); background:transparent; border:0.5px solid var(--line);" id="end-quiet">先静一静</button>
    </div>
  `;
  document.getElementById('modal-root').innerHTML = `<div class="crisis-mask">${html}</div>`;
  document.getElementById('end-to-gb').onclick = () => {
    const S = storageLoad();
    S.shadow.sessionStart = 0;
    storageSave(S);
    closeModal();
    yzMode = 'view';
    switchTab('xiaobai');
  };
  document.getElementById('end-quiet').onclick = () => {
    const S = storageLoad();
    S.shadow.sessionStart = 0;
    storageSave(S);
    closeModal();
    yzMode = 'view';
    renderYingzi();
  };
}

/* ============================================================
 * Me 我
 * ============================================================ */
function renderMe() {
  const S = storageLoad();
  if (!S.onboarded) return;
  const d = dayNum(S.startDate);
  const personas = Object.keys(PERSONAS).map(k => ({
    k, name: PERSONAS[k].name, desc: PERSONAS[k].desc, on: S.persona === k
  }));
  const root = document.getElementById('me-root');
  root.innerHTML = `
    <button class="me-gear" id="me-gear" aria-label="设置">⚙</button>
    <div class="me-head">
      <div class="me-ava">${d}</div>
      <div class="me-id">
        <div class="name">断联中</div>
        <div class="sub">已坚持 ${d} 天</div>
      </div>
    </div>

    <div class="me-section">
      <div class="sec-cap">小白的性格</div>
      <div class="persona-grid" id="me-persona">
        ${personas.map(p => `
          <div class="pg ${p.on ? 'pg-on' : ''}" data-k="${p.k}">
            <div class="pg-b">${p.name}</div>
            <div class="pg-s">${p.desc}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="me-section">
      <div class="sec-cap">戒断</div>
      <div class="me-card">
        <div class="row">
          <div class="l">
            戒断开始日
            <small>计数从这天起</small>
          </div>
          <input class="me-input" type="date" id="me-date" value="${S.startDate}"/>
        </div>
        <div class="row">
          <div class="l">
            ta 的代号
            <small>只存在你的手机里</small>
          </div>
          <input class="me-input" id="me-name" placeholder="可留空" value="${escapeHtml(S.exName || '')}"/>
        </div>
      </div>
    </div>

    <div class="me-section">
      <div class="sec-cap">你的数据</div>
      <div class="me-card">
        <div class="row">
          <div class="l">
            导出数据
            <small>复制为 JSON 备份</small>
          </div>
          <button class="btn-ghost" id="me-export" style="margin:0;padding:8px 16px;font-size:13px;">导出</button>
        </div>
        <div class="row">
          <div class="l">
            清空所有数据
            <small>不可恢复</small>
          </div>
          <button class="btn-ghost btn-ghost-danger" id="me-clear" style="margin:0;padding:8px 16px;font-size:13px;">清空</button>
        </div>
      </div>
    </div>

    <div class="me-foot">断联日记 NOEX · v0.3.0</div>
  `;

  document.querySelectorAll('#me-persona .pg').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.k;
      const S2 = storageLoad();
      if (S2.persona !== k) {
        S2.persona = k;
        storageSave(S2);
        showToast('切换为「' + PERSONAS[k].name + '」');
        renderMe();
      }
    };
  });

  document.getElementById('me-date').onchange = e => {
    const v = e.target.value;
    if (!v) return;
    const S2 = storageLoad();
    S2.startDate = v;
    storageSave(S2);
    showToast('已更新');
    renderMe();
  };
  document.getElementById('me-name').onblur = e => {
    const S2 = storageLoad();
    S2.exName = e.target.value;
    storageSave(S2);
  };

  document.getElementById('me-export').onclick = () => {
    const S2 = storageLoad();
    const json = JSON.stringify(S2, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(
        () => showToast('已复制 JSON 到剪贴板'),
        () => fallbackCopy(json)
      );
    } else fallbackCopy(json);
  };
  function fallbackCopy(t) {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('已复制 JSON 到剪贴板'); }
    catch(e) { showToast('复制失败，请手动选择'); }
    ta.remove();
  }

  document.getElementById('me-clear').onclick = () => {
    const html = `
      <div class="modal-gear">
        <div class="h">清空所有数据？</div>
        <div class="about" style="color:var(--danger);">戒断记录、对话、留白瓶、影子设置都会被删除，无法恢复。</div>
        <button class="btn btn-danger" id="clear-ok" style="margin-top:18px;">确认清空</button>
        <button class="btn btn-ghost" id="cancel" style="margin:10px 0 0;background:transparent;border:0.5px solid var(--line);color:var(--sub);">取消</button>
      </div>
    `;
    showModal(html);
    document.getElementById('clear-ok').onclick = () => {
      const S2 = storageLoad();
      const ds = defaultState();
      ds.startDate = todayStr();
      ds.onboarded = false;
      storageSave(ds);
      showToast('已清空，重新开始');
      closeModal();
      obStep = 0; tempStartDate = ''; tempExName = '';
      document.querySelectorAll('.page-pane').forEach(p => p.classList.remove('active'));
      document.getElementById('page-onboard').classList.add('active');
      renderOnboard();
    };
    document.getElementById('cancel').onclick = closeModal;
  };

  document.getElementById('me-gear').onclick = () => {
    const html = `
      <div class="modal-gear">
        <div class="h">关于断联日记</div>
        <div class="about">
          断联日记 NOEX · v0.3.0 原型<br/>
          <div>所有数据仅保存在本机，不上传服务器。</div>
          <div>对话由本地规则引擎模拟，正式版将接入大模型。</div>
          <div>本产品不替代专业心理治疗。</div>
        </div>
        <div class="crisis">
          <b>遇到危机时，请让真实的人现在陪着你</b>
          <div>· 全国 24 小时心理援助热线：400-161-9995</div>
          <div>· 北京心理危机研究与干预中心：010-82951332</div>
          <div>· 紧急情况请直接拨打 120 / 110</div>
        </div>
        <div class="me-foot" style="margin-top:18px;">愿你断得干净，把时间留给自己</div>
        <button class="btn" id="gear-close" style="margin-top:14px;">关闭</button>
      </div>
    `;
    showModal(html);
    document.getElementById('gear-close').onclick = closeModal;
  };
}

/* ============================================================
 * Boot
 * ============================================================ */
(function boot() {
  console.log('[断联日记] 启动, 版本 0.3.0 (web demo)');
  const S = storageLoad();
  if (S.onboarded) {
    document.querySelectorAll('.page-pane').forEach(p => p.classList.remove('active'));
    document.getElementById('page-today').classList.add('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === 'today'));
    renderToday();
  } else {
    document.querySelectorAll('.page-pane').forEach(p => p.classList.remove('active'));
    document.getElementById('page-onboard').classList.add('active');
    renderOnboard();
  }
})();
</script>
